{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-star"></i> Rate This Event</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <strong>{{ event.event_name }}</strong><br>
                    <small>Event Date: {{ event.event_date.strftime('%d %B %Y') }}</small>
                </div>
                
                <form method="POST" action="{{ url_for('volunteer_feedback', event_id=event.event_id) }}">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Your Rating *</label>
                        <div class="rating-input">
                            <div class="btn-group" role="group">
                                {% for i in range(1, 6) %}
                                <input type="radio" class="btn-check" name="rating" id="star{{ i }}" value="{{ i }}" required>
                                <label class="btn btn-outline-warning" for="star{{ i }}">
                                    {% for j in range(i) %}
                                        <i class="fas fa-star"></i>
                                    {% endfor %}
                                </label>
                                {% endfor %}
                            </div>
                        </div>
                        <div class="form-text">1 = Poor, 5 = Excellent</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="comment" class="form-label fw-bold">Your Comments *</label>
                        <textarea class="form-control" id="comment" name="comment" rows="5" 
                                  placeholder="Share your experience, what went well, suggestions for improvement..." 
                                  required></textarea>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('volunteer_participation_history') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Submit Rating
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
